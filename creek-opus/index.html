<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aki's hollow</title>
    <meta name="description" content="A cozy creek with a stone culvert and a cabin on the bank, rendered live with three.js. Assets modelled procedurally in Blender." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght,SOFT@9..144,500..700,0..100&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene" aria-label="Aki's hollow, a creek running out of a stone culvert below a timber cabin" role="img"></canvas>

    <header class="title-card">
      <h1>Aki's hollow</h1>
      <p>Follow the creek up to the cabin.</p>
    </header>

    <nav class="toolbar" aria-label="Scene controls">
      <div class="pill" role="group" aria-label="Camera">
        <button type="button" class="chip" data-toggle="dslr" aria-pressed="true" title="DSLR lens look (C)">
          <svg class="icon icon-toggle" viewBox="0 0 24 24" aria-hidden="true">
            <path class="icon-fill" d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.3l1.4-2h5.6l1.4 2h2.3A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z" />
            <circle class="icon-cut" cx="12" cy="13" r="3.4" />
          </svg>
          <span>DSLR</span>
        </button>
        <button type="button" class="chip" data-toggle="dof" aria-pressed="true" title="Shallow depth of field (F)">
          <svg class="icon icon-toggle" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="icon-fill" cx="12" cy="12" r="8" />
            <circle class="icon-cut" cx="12" cy="12" r="3.2" />
          </svg>
          <span>DOF</span>
        </button>
      </div>
      <div class="pill" role="group" aria-label="Time of day">
        <button type="button" class="chip" data-preset="afternoon" aria-pressed="true" title="Afternoon (1)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" />
          </svg>
          <span>Afternoon</span>
        </button>
        <button type="button" class="chip" data-preset="golden" aria-pressed="false" title="Golden hour (2)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.5 16a4.5 4.5 0 0 1 9 0M3 19h18M12 6v2.5M5.9 9.9l1.7 1.7M18.1 9.9l-1.7 1.7" />
          </svg>
          <span>Golden</span>
        </button>
        <button type="button" class="chip" data-preset="blue" aria-pressed="false" title="Blue hour (3)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 15h18M8 15a4 4 0 0 1 8 0M7 19h10M17.5 5.5v3M16 7h3M9 6.5v1.5M8.25 7.25h1.5" />
          </svg>
          <span>Blue</span>
        </button>
        <button type="button" class="chip" data-preset="night" aria-pressed="false" title="Night (4)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 14.5A7.5 7.5 0 1 1 9.5 5a6 6 0 0 0 9.5 9.5z" />
          </svg>
          <span>Night</span>
        </button>
      </div>
    </nav>

    <ul class="hints" aria-label="Controls">
      <li>Drag to look</li>
      <li>Scroll to follow the creek</li>
      <li>WASD to walk</li>
    </ul>

    <div class="loading" role="status" aria-live="polite">
      <p class="loading-title">Aki's hollow</p>
      <p class="loading-progress">Gathering stones <span data-progress>0%</span></p>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
