<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrace block</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #8d8a85; font: 14px system-ui, sans-serif; }
  #dock {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 6px; border-radius: 14px;
    background: rgba(24, 22, 20, 0.62); backdrop-filter: blur(14px);
    font: 13px/1 system-ui, sans-serif; user-select: none; -webkit-user-select: none;
  }
  #dock button {
    display: flex; align-items: center; gap: 7px; padding: 9px 14px; border: 0; border-radius: 10px;
    background: transparent; color: rgba(236, 230, 220, 0.55); font: inherit; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  #dock button:hover { color: rgba(250, 245, 236, 0.9); }
  #dock button.active { background: rgba(255, 255, 255, 0.11); color: #faf5ec; }
  #dock .channel { margin-left: 10px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">Loading</div>
<div id="dock"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
